<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainingEDM 3.0</title>

    <!-- Правильное подключение Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h1 {
            color: #bb86fc;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            box-sizing: border-box;
        }

        .menu-btn:active {
            background-color: #2a2a2a;
            transform: scale(0.98);
        }

        .heavy {
            border-left: 6px solid #ff4b4b;
        }

        .light {
            border-left: 6px solid #4caf50;
        }

        .medium {
            border-left: 6px solid #ff9800;
        }

        .screen {
            display: none;
            text-align: left;
            background: #1e1e1e;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #333;
            box-sizing: border-box;
        }

        .active {
            display: block;
        }

        .exercise {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2d2d2d;
        }

        .exercise:last-child {
            border-bottom: none;
        }

        .ex-name {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .ex-weight {
            color: #bb86fc;
            font-weight: bold;
            font-size: 15px;
            margin-top: 3px;
        }

        .ex-note {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
            font-style: italic;
        }

        .back-btn {
            background: #333;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background-color: #bb86fc;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }

        .action-btn:active {
            background-color: #a370db;
        }
    </style>
</head>

<body>

    <!-- ==================== ГЛАВНОЕ МЕНЮ ==================== -->

    <div id="main-screen" class="screen active">

        <h1>TrainingEDM 3.0</h1>

        <div class="subtitle">
            Умный HLM-цикл автотренера
        </div>

        <button
            class="menu-btn heavy"
            onclick="showScreen('heavy-screen')">
            🏋️ ПОНЕДЕЛЬНИК (Тяжёлый)
        </button>

        <button
            class="menu-btn light"
            onclick="showScreen('light-screen')">
            🧘 СРЕДА (Лёгкий / Статика)
        </button>

        <button
            class="menu-btn medium"
            onclick="showScreen('medium-screen')">
            🔥 ПЯТНИЦА (Средний / Лесенка)
        </button>

        <button
            class="menu-btn"
            onclick="showMaxes()">
            📈 Мои Максимумы
        </button>

    </div>


    <!-- ==================== ПОНЕДЕЛЬНИК ==================== -->

    <div id="heavy-screen" class="screen">

        <button
            class="back-btn"
            onclick="showScreen('main-screen')">
            ⬅️ Меню
        </button>

        <h2>🏋️ Тяжёлый день (Сила)</h2>

        <p class="subtitle">
            Без лесенки. Отдых: 2-3 мин. Повторения: 8-10
        </p>

        <div id="heavy-list"></div>

        <button
            class="action-btn"
            onclick="progress('heavy')">
            💪 Закрыл все подходы на 10 раз!
        </button>

    </div>


    <!-- ==================== СРЕДА ==================== -->

    <div id="light-screen" class="screen">

        <button
            class="back-btn"
            onclick="showScreen('main-screen')">
            ⬅️ Меню
        </button>

        <h2>🧘 Лёгкий день (Техника)</h2>

        <p class="subtitle">
            Строго 12 раз. Пауза в пике 2 сек! Отдых: 1.5 мин.
        </p>

        <div id="light-list"></div>

        <button
            class="action-btn"
            style="background:#4caf50; color:white;"
            onclick="showScreen('main-screen')">
            ✅ Тренировка окончена
        </button>

    </div>


    <!-- ==================== ПЯТНИЦА ==================== -->

    <div id="medium-screen" class="screen">

        <button
            class="back-btn"
            onclick="showScreen('main-screen')">
            ⬅️ Меню
        </button>

        <h2>🔥 Средний день (Пампинг)</h2>

        <p class="subtitle">
            Режим ЛЕСЕНКИ на 12 раз. Отдых: 60-90 сек.
        </p>

        <div id="medium-list"></div>

        <button
            class="action-btn"
            onclick="progress('friday')">
            🚀 Вся лесенка закрыта на 12 раз!
        </button>

    </div>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script>

        /* =========================================================
           TELEGRAM WEB APP
        ========================================================= */

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        /* =========================================================
           ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
        ========================================================= */

        const defaultData = {

            bench_press: 18.0,

            t_bar: 20.0,

            lateral_raises: 7.0,

            biceps: 15.0,

            triceps: 30.0,

            leg_press: 40.0,

            leg_extensions: 30.0,

            leg_curls: 25.0

        };


        /* =========================================================
           ПОЛУЧЕНИЕ ДАННЫХ
        ========================================================= */

        function getData() {

            try {

                const savedData =
                    localStorage.getItem('user_data');

                if (!savedData) {

                    localStorage.setItem(
                        'user_data',
                        JSON.stringify(defaultData)
                    );

                    return { ...defaultData };
                }

                const data = JSON.parse(savedData);

                /*
                 * Если в старых данных отсутствует
                 * какое-либо поле — добавляем его
                 */

                return {
                    ...defaultData,
                    ...data
                };

            } catch (error) {

                console.error(
                    'Ошибка загрузки данных:',
                    error
                );

                localStorage.setItem(
                    'user_data',
                    JSON.stringify(defaultData)
                );

                return { ...defaultData };
            }
        }


        /* =========================================================
           СОХРАНЕНИЕ ДАННЫХ
        ========================================================= */

        function saveData(data) {

            try {

                localStorage.setItem(
                    'user_data',
                    JSON.stringify(data)
                );

            } catch (error) {

                console.error(
                    'Ошибка сохранения данных:',
                    error
                );

                alert(
                    '⚠️ Не удалось сохранить данные.'
                );
            }
        }


        /* =========================================================
           ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
        ========================================================= */

        function showScreen(screenId) {

            document
                .querySelectorAll('.screen')
                .forEach(screen => {

                    screen.classList.remove('active');

                });


            const targetScreen =
                document.getElementById(screenId);


            if (!targetScreen) {

                console.error(
                    'Экран не найден:',
                    screenId
                );

                return;
            }


            targetScreen.classList.add('active');


            if (screenId !== 'main-screen') {

                renderExercises(screenId);

            }
        }


        /* =========================================================
           ФОРМАТИРОВАНИЕ ВЕСА
        ========================================================= */

        function formatWeight(value) {

            const number = Number(value);

            if (!Number.isFinite(number)) {
                return 0;
            }

            /*
             * Убираем .0 у целых чисел
             */

            if (Number.isInteger(number)) {
                return number;
            }

            return number.toFixed(1);
        }


        /* =========================================================
           ОТРИСОВКА ТРЕНИРОВКИ
        ========================================================= */

        function renderExercises(screenId) {

            const data = getData();

            let list = "";


            /* =====================================================
               ПОНЕДЕЛЬНИК
            ===================================================== */

            if (screenId === 'heavy-screen') {

                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            1. Жим гантелей лёжа
                        </div>

                        <div class="ex-weight">
                            3х8-10 по ${formatWeight(data.bench_press)} кг
                        </div>

                        <div class="ex-note">
                            Суставы вверху до конца не выпрямляй.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            2. Т-гриф (Тяга)
                        </div>

                        <div class="ex-weight">
                            3х8-10 по ${formatWeight(data.t_bar)} кг
                        </div>

                        <div class="ex-note">
                            Спину держи строго прямой.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            3. Махи гантелями в стороны
                        </div>

                        <div class="ex-weight">
                            3х10 по ${formatWeight(data.lateral_raises)} кг
                        </div>

                        <div class="ex-note">
                            Чистая работа средними дельтами.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            4. Бицепс (локти в упоре сидя)
                        </div>

                        <div class="ex-weight">
                            3х10 по ${formatWeight(data.biceps)} кг
                        </div>

                        <div class="ex-note">
                            Без раскачки корпуса.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            5. Трицепс (гантель за голову)
                        </div>

                        <div class="ex-weight">
                            3х10 по 12-14 кг
                        </div>

                        <div class="ex-note">
                            Локти в стороны не разводи.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            6. Жим ногами (база)
                        </div>

                        <div class="ex-weight">
                            3х10 по ${formatWeight(data.leg_press)} кг
                        </div>

                        <div class="ex-note">
                            Колени ближе друг к другу, глубоко.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            7. Гиперэкстензия
                        </div>

                        <div class="ex-weight">
                            2х20 повторений
                        </div>

                        <div class="ex-note">
                            Без веса, разгрузка поясницы после Т-грифа.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            8. Пресс на шаре
                        </div>

                        <div class="ex-weight">
                            2-3х20-30 раз
                        </div>

                    </div>
                `;


                document.getElementById(
                    'heavy-list'
                ).innerHTML = list;
            }


            /* =====================================================
               СРЕДА
            ===================================================== */

            else if (screenId === 'light-screen') {

                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            1. Хаммер (грудь)
                        </div>

                        <div class="ex-weight">
                            3х12 по ${formatWeight(
                                Math.round(data.bench_press * 0.7)
                            )} кг
                        </div>

                        <div class="ex-note">
                            Работа внутри амплитуры, локти не вставлять.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            2. Горизонтальный блок
                        </div>

                        <div class="ex-weight">
                            3х12 по ${formatWeight(
                                Math.round(data.t_bar * 0.8)
                            )} кг
                        </div>

                        <div class="ex-note">
                            Пауза 2 секунды при сводке лопаток!
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            3. Махи на заднюю дельту
                        </div>

                        <div class="ex-weight">
                            3х12 по 5 кг
                        </div>

                        <div class="ex-note">
                            Идеальный контроль траектории.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            4. Бицепс (машина трос)
                        </div>

                        <div class="ex-weight">
                            3х12 по 10 кг
                        </div>

                        <div class="ex-note">
                            Плавно, без рывков.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            5. Трицепс (кроссовер)
                        </div>

                        <div class="ex-weight">
                            3х12 по ${formatWeight(
                                Math.round(data.triceps * 0.7)
                            )} кг
                        </div>

                        <div class="ex-note">
                            Зажать внизу на 2 секунды.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            6. Выпрямление ног
                        </div>

                        <div class="ex-weight">
                            3х12 по 20 кг
                        </div>

                        <div class="ex-note">
                            Фиксация и зажим квадрицепса вверху.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            7. Сгибание ног
                        </div>

                        <div class="ex-weight">
                            3х12 по 15 кг
                        </div>

                        <div class="ex-note">
                            Прожать бицепс бедра внизу.
                        </div>

                    </div>
                `;


                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            8. Пресс в кроссовере
                        </div>

                        <div class="ex-weight">
                            2-3х20 повторений
                        </div>

                    </div>
                `;


                document.getElementById(
                    'light-list'
                ).innerHTML = list;
            }


            /* =====================================================
               ПЯТНИЦА
            ===================================================== */

            else if (screenId === 'medium-screen') {

                list += `
                    <div class="exercise">

                        <div class="ex-name">
                            1. Жим гантелей лёжа
                        </div>

                        <div class="ex-weight">
                            Лесенка:
                            ${formatWeight(data.bench_press - 4)}
                            /
